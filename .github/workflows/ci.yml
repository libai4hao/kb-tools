name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.11", "3.13"]
        exclude:
          # ubuntu-latest 已升到 26.04，setup-python 没有 3.8 的构建
          - os: ubuntu-latest
            python: "3.8"
        include:
          - os: ubuntu-22.04
            python: "3.8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 编译检查
        run: python -m compileall -q md_pull_images.py tests

      - name: 离线测试
        run: python -m unittest discover -s tests -v
